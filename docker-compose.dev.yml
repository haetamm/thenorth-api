version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: thenorth-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: thenorth-app-dev
    environment:
      NODE_ENV: development
      DB_USER: postgres
      DB_PASS: yourpassword
      DB_NAME: app_dev
      DB_HOST: db
      DB_PORT: 5432
      # HAPUS baris NODE_OPTIONS ini
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # Langsung pake ts-node-dev dengan flag --poll
    command: sh -c "npm install && npx ts-node-dev --poll --respawn src/index.ts"

volumes:
  postgres_dev_data:
  node_modules: